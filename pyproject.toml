[project]
name = "lepas-ha"
version = "0.1.0"
description = "Home Assistant custom integration and async client for Lepas L8 (Chery EU platform)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "homeassistant>=2024.1.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
